                        original: "再仔細地黏貼組合。",
                        prompt: "最後第三步完成什麼？",
                        bank: ["再進行精緻的擺盤。", "再分析實驗結果。", "再用拖把將地板拖乾淨。"]
                    }
                ]
            }
        ];

        // State Management
        let currentTopic = TOPIC_DATABASE[0];
        let userInputs = {}; // Stores { componentIndex: currentWord }
        let showWordBank = {}; // Stores { componentIndex: boolean }

        // DOM Elements
        const topicSelect = document.getElementById('topic-select');
        const customSentenceInput = document.getElementById('custom-sentence');
        const applyCustomBtn = document.getElementById('apply-custom-btn');
        const targetSentenceDisplay = document.getElementById('target-sentence-display');
        const posContainer = document.getElementById('pos-elements-container');
        const generatedResult = document.getElementById('generated-result');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const toggleWordbankGlobalBtn = document.getElementById('toggle-wordbank-global');
        const resetBtn = document.getElementById('reset-btn');
        const speakBtn = document.getElementById('speak-btn');
        const copyBtn = document.getElementById('copy-btn');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initTopicSelect();
            loadTopic(TOPIC_DATABASE[0]);
            setupEventListeners();
        });

        // Populate Dropdown Options Grouped by Category
        function initTopicSelect() {
            topicSelect.innerHTML = '';
            
            // Group by category
            const categories = {};
            TOPIC_DATABASE.forEach((topic, idx) => {
                const cat = topic.category || "其他題型";
                if(!categories[cat]) categories[cat] = [];
                categories[cat].push({ topic, idx });
            });

            for(const catName in categories) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = catName;
                
                categories[catName].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.idx;
                    opt.textContent = item.topic.title;
                    optGroup.appendChild(opt);
                });
                
                topicSelect.appendChild(optGroup);
            }
        }

        // Load Selected Topic Into Interactive UI
        function loadTopic(topic) {
            currentTopic = topic;
            userInputs = {};
            showWordBank = {};

            // Set initial state
            topic.components.forEach((comp, idx) => {
                userInputs[idx] = comp.original;
                showWordBank[idx] = false;
            });

            // Update UI Displays
            targetSentenceDisplay.textContent = currentTopic.sentence;
            renderPosComponents();
            updateLivePreview();
            updateProgress();
        }

        // Render Structure Breakdown Components
        function renderPosComponents() {
            posContainer.innerHTML = '';

            currentTopic.components.forEach((comp, idx) => {
                const card = document.createElement('div');
                card.className = "step-card bg-slate-50 rounded-xl p-5 border border-slate-200 hover:border-indigo-300 transition";

                const isCustomized = userInputs[idx] !== comp.original;

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-md">
                                ${comp.label}
                            </span>
                            <span class="text-xs text-slate-500 font-medium">原句範例：<strong class="text-slate-700">${comp.original}</strong></span>
                        </div>
                        <button class="toggle-bank-btn text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1" data-index="${idx}">
                            <i class="fa-solid ${showWordBank[idx] ? 'fa-eye-slash' : 'fa-lightbulb'} text-amber-500"></i>
                            ${showWordBank[idx] ? '收起靈感詞庫' : '靈感詞庫輔助'}
                        </button>
                    </div>

                    <!-- Prompt Text for Student Thinking -->
                    <p class="text-xs text-slate-600 mb-3 bg-white p-2.5 rounded-lg border border-slate-100 flex items-start gap-2">
                        <i class="fa-solid fa-circle-question text-indigo-400 mt-0.5"></i>
                        <span><strong>思考引導：</strong>${comp.prompt}</span>
                    </p>

                    <!-- Student Input Field -->
                    <div class="relative">
                        <input type="text" 
                            data-index="${idx}" 
                            value="${userInputs[idx]}" 
                            placeholder="請在此輸入你的聯想詞彙..." 
                            class="user-word-input w-full p-3 pr-10 border ${isCustomized ? 'border-emerald-500 bg-emerald-50/30' : 'border-slate-300'} rounded-xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        ${isCustomized ? '<i class="fa-solid fa-circle-check text-emerald-500 absolute right-3 top-3.5 text-lg"></i>' : ''}
                    </div>

                    <!-- Word Bank Drawer -->
                    ${showWordBank[idx] ? `
                        <div class="mt-4 pt-3 border-t border-slate-200/80 animate-fadeIn">
                            <span class="text-xs font-semibold text-slate-500 block mb-2 flex items-center gap-1">
                                <i class="fa-solid fa-tags text-indigo-400"></i> 點擊詞彙直接套用：
                            </span>
                            <div class="flex flex-wrap gap-2">
                                ${comp.bank.map(word => `
                                    <button class="bank-chip word-chip text-xs bg-white hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 border border-slate-200 hover:border-indigo-300 font-medium px-3 py-1.5 rounded-lg shadow-sm transition" data-index="${idx}" data-word="${word}">
                                        ${word}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;

                posContainer.appendChild(card);
            });

            // Re-bind dynamic events inside cards
            bindCardEvents();
        }

        // Bind Card-level Events
        function bindCardEvents() {
            // Input changes
            document.querySelectorAll('.user-word-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    userInputs[idx] = e.target.value;
                    updateLivePreview();
                    updateProgress();
                    
                    // Toggle border styling
                    if(userInputs[idx] !== currentTopic.components[idx].original) {
                        e.target.classList.add('border-emerald-500', 'bg-emerald-50/30');
                        e.target.classList.remove('border-slate-300');
                    } else {
                        e.target.classList.remove('border-emerald-500', 'bg-emerald-50/30');
                        e.target.classList.add('border-slate-300');
                    }
                });
            });

            // Toggle word bank
            document.querySelectorAll('.toggle-bank-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = btn.dataset.index || btn.closest('button').dataset.index;
                    showWordBank[idx] = !showWordBank[idx];
                    renderPosComponents();
                });
            });

            // Click word bank chip
            document.querySelectorAll('.bank-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    const idx = chip.dataset.index;
                    const word = chip.dataset.word;
                    userInputs[idx] = word;
                    renderPosComponents();
                    updateLivePreview();
                    updateProgress();
                    showToast(`已套用詞彙：「${word}」`);
                });
            });
        }

        // Update Live Story Result Preview
        function updateLivePreview() {
            let sentencePieces = [];
            currentTopic.components.forEach((comp, idx) => {
                const word = userInputs[idx] || '';
                const isModified = word !== comp.original;
                
                // Wrap modified words in highlight style
                if (isModified && word.trim() !== '') {
                    sentencePieces.push(`<span class="text-indigo-600 font-extrabold underline decoration-indigo-300 underline-offset-4">${escapeHtml(word)}</span>`);
                } else {
                    sentencePieces.push(`<span class="text-slate-700">${escapeHtml(word)}</span>`);
                }
            });

            generatedResult.innerHTML = sentencePieces.join('');
        }

        // Calculate and Update Student Progress
        function updateProgress() {
            const total = currentTopic.components.length;
            let modifiedCount = 0;

            currentTopic.components.forEach((comp, idx) => {
                if (userInputs[idx] && userInputs[idx] !== comp.original && userInputs[idx].trim() !== '') {
                    modifiedCount++;
                }
            });

            const percent = Math.round((modifiedCount / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}% (${modifiedCount}/${total} 處替換)`;

            if(percent === 100) {
                progressBar.classList.remove('bg-indigo-600');
                progressBar.classList.add('bg-emerald-500');
            } else {
                progressBar.classList.remove('bg-emerald-500');
                progressBar.classList.add('bg-indigo-600');
            }
        }

        // Global Event Listeners
        function setupEventListeners() {
            // Preset Topic Selection
            topicSelect.addEventListener('change', (e) => {
                const selectedIndex = e.target.value;
                loadTopic(TOPIC_DATABASE[selectedIndex]);
                showToast(`已切換至：${TOPIC_DATABASE[selectedIndex].title}`);
            });

            // Custom Sentence Logic
            applyCustomBtn.addEventListener('click', () => {
                const text = customSentenceInput.value.trim();
                if (!text) {
                    showToast('請輸入一個完整的句子！', 'fa-exclamation-triangle');
                    return;
                }

                const customTopic = parseCustomSentence(text);
                loadTopic(customTopic);
                showToast('已自訂並解析句子！');
            });

            // Global Word Bank Toggle
            toggleWordbankGlobalBtn.addEventListener('click', () => {
                const allOpen = Object.values(showWordBank).every(v => v === true);
                currentTopic.components.forEach((_, idx) => {
                    showWordBank[idx] = !allOpen;
                });
                renderPosComponents();
            });

            // Reset Button
            resetBtn.addEventListener('click', () => {
                loadTopic(currentTopic);
                showToast('已重置為初始句型。');
            });

            // Speech Synthesis (Read Aloud)
            speakBtn.addEventListener('click', () => {
                const textToRead = generatedResult.textContent;
                if (!('speechSynthesis' in window)) {
                    showToast('您的瀏覽器不支援語音朗讀功能。', 'fa-exclamation-circle');
                    return;
                }

                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
                showToast('正在朗讀創作文章...');
            });

            // Copy Result Text
            copyBtn.addEventListener('click', () => {
                const textToCopy = generatedResult.textContent.trim();
                
                const el = document.createElement('textarea');
                el.value = textToCopy;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);

                showToast('已成功複製全新創作！', 'fa-circle-check');
            });
        }

        // Helper: Simple Parser for User Custom Sentence
        function parseCustomSentence(sentence) {
            const cleanText = sentence.replace(/[，。！？」]/g, '');
            const len = cleanText.length;
            const chunkSize = Math.max(1, Math.floor(len / 4));

            const part1 = cleanText.substring(0, chunkSize) || "美好的";
            const part2 = cleanText.substring(chunkSize, chunkSize * 2) || "時光";
            const part3 = cleanText.substring(chunkSize * 2, chunkSize * 3) || "悄悄地";
            const part4 = cleanText.substring(chunkSize * 3) || "流逝";

            return {
                id: "custom_" + Date.now(),
                category: "自訂題目",
                title: "【自訂題目】" + sentence.substring(0, 10) + "...",
                sentence: sentence,
                components: [
                    {
                        type: "part1",
                        label: "前置/修飾成分",
                        role: "句子的起頭或修飾部分",
                        original: part1,
                        prompt: "這個部分可以用什麼詞來描述或形容？",
                        bank: ["美麗的", "寧靜的", "突然間", "陽光下", "漸漸地"]
                    },
                    {
                        type: "part2",
                        label: "主要對象 (名詞)",
                        role: "句子的核心人物或事物",
                        original: part2,
                        prompt: "故事的主角或核心是什麼？",
                        bank: ["小鳥", "溪流", "少年", "時光", "微風"]
                    },
                    {
                        type: "part3",
                        label: "動作狀態 (副詞/修飾)",
                        role: "動作發生的模樣或速度",
                        original: "悄悄地",
                        prompt: "這個動作進行得怎麼樣？",
                        bank: ["快樂地", "飛快地", "悄悄地", "輕柔地", "堅定地"]
                    },
                    {
                        type: "part4",
                        label: "核心動作/結果",
                        role: "進行的動作或最後狀態",
                        original: part4,
                        prompt: "主角做了什麼事，或是產生了什麼變化？",
                        bank: ["飛向遠方", "閃耀著光芒", "歌唱著", "跨越挑戰", "悄然展開"]
                    }
                ]
            };
        }

        // Toast Notification Helper
        function showToast(msg, iconClass = 'fa-circle-info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass} text-indigo-400`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        // Utility: HTML Escaping
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
